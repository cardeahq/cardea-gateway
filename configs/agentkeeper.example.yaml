# Example agentkeeper configuration. Copy to ./agentkeeper.yaml or pass
# --config <path>. Every key can also be set via an AGENTKEEPER_-prefixed
# environment variable, e.g. AGENTKEEPER_SERVER_LISTEN_ADDR.

server:
  listen_addr: ":8080"

logging:
  level: info    # debug | info | warn | error
  format: console # console | json

rules:
  path: "" # path to a rules file defining circuit breakers, token compaction, etc.

# The upstream LLM provider agentkeeper forwards all requests to. Callers
# don't choose a provider; every request to the gateway goes to this one.
# Anthropic is the only supported provider for now.
provider:
  name: anthropic
  base_url: "https://api.anthropic.com"
  # Name of the environment variable holding the upstream API key.
  # agentkeeper reads the key from this env var at startup and injects it
  # into upstream requests itself; the key is never set here, never
  # accepted via caller-supplied headers, and never logged.
  api_key_env: "ANTHROPIC_API_KEY"

# The staging pipeline every proxied call passes through before reaching
# the provider. /healthz bypasses it entirely.
pipeline:
  # Largest request body the pipeline will read for stage inspection;
  # also the cap on how much of a response is retained for observation.
  max_body_bytes: 10485760 # 10 MiB
  stages:
    identification: false # off by default — see note below
    tracing: true # records every request and response; see tracing below
    policies: true # allows everything until policies.path is set; see policies below

# Agents agentkeeper recognizes once identification is enabled. Each
# entry needs api_key_env, jwt_secret_env, or both. Credential values are
# never written here — only the name of the environment variable holding
# them, matching provider.api_key_env.
#
# identification defaults to false, unlike every other pipeline stage:
# enabled with zero agents registered denies every call, since no caller
# could possibly be identified. Turning it on is a deliberate act paired
# with registering at least one agent below.
agents: []
  # - agent_id: "acme-bot"
  #   api_key_env: "AGENT_ACME_BOT_API_KEY"
  # - agent_id: "beta-bot"
  #   jwt_secret_env: "AGENT_BETA_BOT_JWT_SECRET"

# Call tracing: one JSON record per request and per response, handed to the
# trace sink. Records carry metadata and keyed fingerprints only — never
# prompt content, tool arguments or tool results.
tracing:
  # Env var holding the fingerprint HMAC key (>= 32 bytes). If unset,
  # a random key is generated at startup (with a warning), and
  # fingerprints no longer match across restarts or instances.
  fingerprint_key_env: "TRACE_FINGERPRINT_KEY"
  # Largest part of a response tracing reads to record tool calls: one
  # streamed tool call's arguments, or a whole non-streamed response.
  # Past it, the tool call (or response) is recorded as unread.
  max_read_bytes: 16777216 # 16 MiB
  sink:
    type: logging # logging | cardea | logging+cardea
    path: "" # "" = stdout (application logs go to stderr); otherwise a file agentkeeper appends to
    # Read only when type includes cardea. The API key is never written
    # here: api_key_env names the env var that holds it. The key alone
    # identifies your organization. A sink failure is logged and never
    # denies a call.
    cardea:
      endpoint: "" # required: full URL; https, or http on localhost
      api_key_env: "" # required: name of the env var holding the API key
      queue_size: 10000 # records held; when full, new records are dropped
      queue_max_bytes: 67108864 # 64 MiB
      batch_max_records: 500
      batch_max_bytes: 1048576
      batch_max_delay: 1s
      request_timeout: 10s
      shutdown_timeout: 10s # time to deliver held records on exit; 0 skips
  # Where each agent carries its own session identifier, tried in order.
  # A source is one of header, body_field (dot-separated path into the
  # JSON body) or baggage (a key of the W3C baggage header), with an
  # optional pattern whose single capture group is the session. An entry
  # applies to the listed agents, or with default: true to every agent
  # without a list of its own.
  sessions: []
  # - agents: ["agent-alpha"]
  #   sources:
  #     - body_field: metadata.user_id
  #       pattern: '_session_([0-9a-f-]{36})$'
  # - default: true
  #   sources:
  #     - header: X-Session-Id
  #     - baggage: session.id

# Policy rules: a Rego file decides whether each request is forwarded.
# Rules live in `package cardea.policy` and add rule identifiers to the
# set `deny`; any identifier denies the call (403). Evaluation failures
# deny with 503. The file is read at startup (a bad policy stops serve)
# and again on SIGHUP or, with watch: true, on file change; a failed reload
# keeps the previous policy.
policies:
  path: "" # the .rego policy file; "" = no policy
  data: [] # .json / .yaml files or directories, exposed to rules as `data`
  watch: false # reload when a policy or data file changes
  watch_settle: 500ms # wait this long after the last change before reloading
  eval_timeout: 100ms # longest one evaluation may take
