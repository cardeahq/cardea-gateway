# Example agentkeeper configuration. Copy to ./agentkeeper.yaml or pass
# --config <path>. Every key can also be set via an AGENTKEEPER_-prefixed
# environment variable, e.g. AGENTKEEPER_SERVER_LISTEN_ADDR.

server:
  listen_addr: ":8080"

logging:
  level: info    # debug | info | warn | error
  format: console # console | json

rules:
  path: "" # path to a rules file defining circuit breakers, token compaction, etc.

# The upstream LLM provider agentkeeper forwards all requests to. Callers
# don't choose a provider; every request to the gateway goes to this one.
# Anthropic is the only supported provider for now.
provider:
  name: anthropic
  base_url: "https://api.anthropic.com"
  # Name of the environment variable holding the upstream API key.
  # agentkeeper reads the key from this env var at startup and injects it
  # into upstream requests itself; the key is never set here, never
  # accepted via caller-supplied headers, and never logged.
  api_key_env: "ANTHROPIC_API_KEY"

# The staging pipeline every proxied call passes through before reaching
# the provider. /healthz bypasses it entirely.
pipeline:
  # Largest request body the pipeline will read for stage inspection;
  # also the cap on how much of a response is retained for observation.
  max_body_bytes: 10485760 # 10 MiB
  stages:
    token_counting: true
    identification: false # off by default — see note below

# Agents agentkeeper recognizes once identification is enabled. Each
# entry needs api_key_env, jwt_secret_env, or both. Credential values are
# never written here — only the name of the environment variable holding
# them, matching provider.api_key_env.
#
# identification defaults to false, unlike every other pipeline stage:
# enabled with zero agents registered denies every call, since no caller
# could possibly be identified. Turning it on is a deliberate act paired
# with registering at least one agent below.
agents: []
  # - agent_id: "acme-bot"
  #   api_key_env: "AGENT_ACME_BOT_API_KEY"
  # - agent_id: "beta-bot"
  #   jwt_secret_env: "AGENT_BETA_BOT_JWT_SECRET"
